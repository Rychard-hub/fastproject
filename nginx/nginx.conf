server {
    listen 80;
    server_name rychdesigns.uk www.rychdesigns.uk api.rychdesigns.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rychdesigns.uk www.rychdesigns.uk;

    ssl_certificate /etc/letsencrypt/live/rychdesigns.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rychdesigns.uk/privkey.pem;
    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shop API (if separate prefix is needed or just keep under /api)
    location /shop/ {
        proxy_pass http://backend:8000/shop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog API
    location /blog/ {
        proxy_pass http://backend:8000/blog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio API
    location /portfolio {
        proxy_pass http://backend:8000/portfolio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.rychdesigns.uk;

    ssl_certificate /etc/letsencrypt/live/rychdesigns.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rychdesigns.uk/privkey.pem;

    location / {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
